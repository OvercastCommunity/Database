name: build and deploy
on:
  push:
    branches: [dev]
  pull_request:
jobs:
  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: setup java
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'temurin'
          cache: 'maven'
      - name: check formatting
        run: mvn --batch-mode com.spotify.fmt:fmt-maven-plugin:check
      - name: build with maven
        run: mvn --batch-mode --update-snapshots verify

  deploy:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: deployment
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: setup java
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'temurin'
          cache: 'maven'
      - name: build and deploy to maven
        run: mvn --batch-mode --update-snapshots deploy -s settings.xml
        env:
          REPO_USERNAME: ${{ secrets.REPO_USERNAME }}
          REPO_PASSWORD: ${{ secrets.REPO_PASSWORD }}
      - name: rename artifact
        run: mv target/Database-*.jar Database.jar
      - name: set short sha
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - name: create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: Database-${{ env.SHORT_SHA }}
          name: Release ${{ env.SHORT_SHA }}
          draft: false
          prerelease: false
          files: Database.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
